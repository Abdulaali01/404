<script>
/* ================== IndexedDB (مع إعادة اتصال تلقائي) ================== */
const DB_NAME='geoPhotosDB', STORE='photos', META='meta';
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains(META)) d.createObjectStore(META,{keyPath:'key'});
    };
    req.onsuccess=e=>{
      db=e.target.result;
      db.onclose=()=>{db=null;};
      db.onversionchange=()=>{try{db.close();}catch(_){} db=null;};
      res(db);
    };
    req.onerror=()=>rej(req.error);
    req.onblocked=()=>rej(new Error('DB blocked'));
  });
}
async function ensureDB(){ if(!db) await openDB(); return db; }

async function withDB(fn){
  try{
    await ensureDB();
    return await fn();
  }catch(err){
    if(err && err.name==='QuotaExceededError') throw err;
    try{ if(db) db.close(); }catch(_){}
    db=null;
    await openDB();
    return await fn();
  }
}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Transaction aborted'));});}
function reqDone(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}

function addPhoto(p){return withDB(()=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).add(p);return txDone(t);});}
function getAllPhotos(){return withDB(async()=>{const r=await reqDone(db.transaction(STORE).objectStore(STORE).getAll());return (r||[]).sort((a,b)=>a.time-b.time);});}
function deletePhoto(id){return withDB(()=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);return txDone(t);});}
function clearPhotos(){return withDB(()=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();return txDone(t);});}
function metaGet(key){return withDB(async()=>{const r=await reqDone(db.transaction(META).objectStore(META).get(key));return r?r.val:null;});}
function metaSet(key,val){return withDB(()=>{const t=db.transaction(META,'readwrite');t.objectStore(META).put({key,val});return txDone(t);});}

/* ================== Helpers ================== */
const $=id=>document.getElementById(id);
function showOverlay(t){$('overlayText').textContent=t;$('overlay').classList.add('show');}
function hideOverlay(){$('overlay').classList.remove('show');}
let toastTimer=null;
function toast(msg,ms=3000){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ts){return new Date(ts).toLocaleString('ar-SA',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function fmtTimeNum(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} - ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtCoord(p){
  if(p.lat==null) return null;
  const la=p.lat>=0?'N':'S', lo=p.lng>=0?'E':'W';
  return `${Math.abs(p.lat).toFixed(6)}° ${la}, ${Math.abs(p.lng).toFixed(6)}° ${lo}`;
}
function explainError(err){
  const n=err&&err.name||'', m=err&&err.message||String(err);
  if(n==='QuotaExceededError') return '❌ مساحة التخزين ممتلئة — احذف بعض الصور أو صدّرها PDF ثم امسحها';
  if(m.startsWith('IMG')) return '❌ تعذر قراءة الصورة — جرّب تصويرها مرة أخرى';
  if(n==='InvalidStateError'||m.includes('closing')) return '❌ انقطع اتصال التخزين — أعد المحاولة';
  return '❌ حدث خطأ أثناء الحفظ: '+(n||m);
}

/* ================== المسافة بين إحداثيتين ================== */
function distM(lat1,lng1,lat2,lng2){
  const R=6371000, t=x=>x*Math.PI/180;
  const dLat=t(lat2-lat1), dLng=t(lng2-lng1);
  const h=Math.sin(dLat/2)**2+Math.cos(t(lat1))*Math.cos(t(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDist(m){return m<1000?Math.round(m)+' م':(m/1000).toFixed(2)+' كم';}
function fmtDistEn(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';}
function distClass(m){return m<=50?'dist-ok':(m<=200?'dist-mid':'dist-far');}

/* ================== Arabic reshaper ================== */
const AR_DUAL={'ب':[0xFE8F,0xFE90,0xFE91,0xFE92],'ت':[0xFE95,0xFE96,0xFE97,0xFE98],'ث':[0xFE99,0xFE9A,0xFE9B,0xFE9C],'ج':[0xFE9D,0xFE9E,0xFE9F,0xFEA0],'ح':[0xFEA1,0xFEA2,0xFEA3,0xFEA4],'خ':[0xFEA5,0xFEA6,0xFEA7,0xFEA8],'س':[0xFEB1,0xFEB2,0xFEB3,0xFEB4],'ش':[0xFEB5,0xFEB6,0xFEB7,0xFEB8],'ص':[0xFEB9,0xFEBA,0xFEBB,0xFEBC],'ض':[0xFEBD,0xFEBE,0xFEBF,0xFEC0],'ط':[0xFEC1,0xFEC2,0xFEC3,0xFEC4],'ظ':[0xFEC5,0xFEC6,0xFEC7,0xFEC8],'ع':[0xFEC9,0xFECA,0xFECB,0xFECC],'غ':[0xFECD,0xFECE,0xFECF,0xFED0],'ف':[0xFED1,0xFED2,0xFED3,0xFED4],'ق':[0xFED5,0xFED6,0xFED7,0xFED8],'ك':[0xFED9,0xFEDA,0xFEDB,0xFEDC],'ل':[0xFEDD,0xFEDE,0xFEDF,0xFEE0],'م':[0xFEE1,0xFEE2,0xFEE3,0xFEE4],'ن':[0xFEE5,0xFEE6,0xFEE7,0xFEE8],'ه':[0xFEE9,0xFEEA,0xFEEB,0xFEEC],'ي':[0xFEF1,0xFEF2,0xFEF3,0xFEF4],'ئ':[0xFE89,0xFE8A,0xFE8B,0xFE8C]};
const AR_RIGHT={'ء':[0xFE80],'آ':[0xFE81,0xFE82],'أ':[0xFE83,0xFE84],'ؤ':[0xFE85,0xFE86],'إ':[0xFE87,0xFE88],'ا':[0xFE8D,0xFE8E],'ة':[0xFE93,0xFE94],'د':[0xFEA9,0xFEAA],'ذ':[0xFEAB,0xFEAC],'ر':[0xFEAD,0xFEAE],'ز':[0xFEAF,0xFEB0],'و':[0xFEED,0xFEEE],'ى':[0xFEEF,0xFEF0]};
const AR_LIG={'لا':[0xFEFB,0xFEFC],'لأ':[0xFEF7,0xFEF8],'لإ':[0xFEF9,0xFEFA],'لآ':[0xFEF5,0xFEF6]};
function isAr(ch){return AR_DUAL[ch]||AR_RIGHT[ch];}
function reshapeArabic(str){
  const chars=[...String(str)]; let out='';
  for(let i=0;i<chars.length;i++){
    const ch=chars[i];
    if(ch==='ل'&&i+1<chars.length&&AR_LIG['ل'+chars[i+1]]){
      const prev=i>0&&isAr(chars[i-1])&&AR_DUAL[chars[i-1]];
      out+=String.fromCodePoint(AR_LIG['ل'+chars[i+1]][prev?1:0]); i++; continue;
    }
    if(AR_DUAL[ch]){
      const f=AR_DUAL[ch];
      const prev=i>0&&isAr(chars[i-1])&&AR_DUAL[chars[i-1]];
      const next=i+1<chars.length&&isAr(chars[i+1]);
      if(prev&&next) out+=String.fromCodePoint(f[3]);
      else if(prev)  out+=String.fromCodePoint(f[1]);
      else if(next)  out+=String.fromCodePoint(f[2]);
      else           out+=String.fromCodePoint(f[0]);
    }else if(AR_RIGHT[ch]){
      const f=AR_RIGHT[ch];
      const prev=i>0&&isAr(chars[i-1])&&AR_DUAL[chars[i-1]];
      out+=String.fromCodePoint(prev?f[1]:f[0]);
    }else out+=ch;
  }
  return out;
}
const AR=s=>reshapeArabic(s);

/* ================== Arabic font loader ================== */
let fontB64=null;
const FONT_URLS=[
  'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf',
  'https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf',
  'https://cdn.jsdelivr.net/gh/aliftype/amiri@master/fonts/amiri-regular.ttf'
];
function abToB64(buf){
  const bytes=new Uint8Array(buf); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
async function loadArabicFont(doc){
  try{
    if(!fontB64){ fontB64=await metaGet('arabicFont').catch(()=>null); }
    if(!fontB64){
      for(const url of FONT_URLS){
        try{
          const r=await fetch(url);
          if(!r.ok) continue;
          fontB64=abToB64(await r.arrayBuffer());
          metaSet('arabicFont',fontB64).catch(()=>{});
          break;
        }catch(e){}
      }
    }
    if(!fontB64) return false;
    doc.addFileToVFS('ArabicFont.ttf',fontB64);
    doc.addFont('ArabicFont.ttf','ArabicFont','normal');
    doc.setFont('ArabicFont');
    return true;
  }catch(e){ return false; }
}

/* ================== Geolocation ================== */
function getPosition(){
  return new Promise(res=>{
    if(!navigator.geolocation){res(null);return;}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      ()=>res(null),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0}
    );
  });
}

/* ================== Image processing ================== */
function drawToJpeg(src,w0,h0,maxDim,quality){
  const scale=Math.min(1,maxDim/Math.max(w0,h0));
  const w=Math.max(1,Math.round(w0*scale)), h=Math.max(1,Math.round(h0*scale));
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.drawImage(src,0,0,w,h);
  const out=c.toDataURL('image/jpeg',quality);
  c.width=c.height=0;
  if(!out||out.length<100) throw new Error('IMG encode failed');
  return out;
}
function loadViaImgTag(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);res(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('IMG decode failed'));};
    img.src=url;
  });
}
async function compressImage(file,maxDim=1400,quality=0.82){
  if(!file||!file.size) throw new Error('IMG empty file');
  if(window.createImageBitmap){
    try{
      const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
      try{ return drawToJpeg(bmp,bmp.width,bmp.height,maxDim,quality); }
      finally{ bmp.close&&bmp.close(); }
    }catch(e){}
  }
  const img=await loadViaImgTag(file);
  return drawToJpeg(img,img.naturalWidth||img.width,img.naturalHeight||img.height,maxDim,quality);
}

/* ================== الحي ================== */
const hoodInput=$('hoodInput');
try{ hoodInput.value=localStorage.getItem('hood')||''; }catch(_){}
hoodInput.addEventListener('input',()=>{try{localStorage.setItem('hood',hoodInput.value.trim());}catch(_){}});
const getHood=()=>hoodInput.value.trim();

/* ================== Excel: قراءة البلاغات ================== */
let reportRows=[];      // صفوف الجدول بعد إزالة تكرار الجوال
let reportFile='';
let captureRowKey=null; // الصف الذي نلتقط له صورة الآن

function normDigits(s){
  return String(s??'')
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g,'.').replace(/،/g,',');
}
function normPhone(v){
  let d=normDigits(v).replace(/\D/g,'');
  if(d.startsWith('00966')) d=d.slice(5);
  else if(d.startsWith('966')) d=d.slice(3);
  if(d.length===9 && d[0]==='5') d='0'+d;
  return d;
}
// استخراج الإحداثيات الرقمية من رابط خرائط أو نص
function extractCoords(v){
  let s=normDigits(v);
  try{ s=decodeURIComponent(s); }catch(_){}
  const N='(-?\\d{1,3}(?:\\.\\d+)?)';
  const patterns=[
    new RegExp('!3d'+N+'!4d'+N),
    new RegExp('@'+N+',\\s*'+N),
    new RegExp('[?&](?:q|query|ll|destination|daddr|center|sll)=(?:loc:)?\\s*'+N+'\\s*,\\s*'+N),
    /(-?\d{1,2}\.\d{3,})\s*[,\s]\s*(-?\d{1,3}\.\d{3,})/
  ];
  for(const re of patterns){
    const m=s.match(re);
    if(m){
      const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
      if(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(lat===0&&lng===0))
        return {lat,lng};
    }
  }
  return null;
}
function isShortLink(v){return /goo\.gl|maps\.app|bit\.ly/i.test(String(v||''));}
const cleanHead=s=>String(s??'').replace(/\s+/g,'').trim();

function parseWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws||!ws['!ref']) throw new Error('الملف فارغ');
  const range=XLSX.utils.decode_range(ws['!ref']);
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,blankrows:true});

  // البحث عن صف العناوين
  let hr=-1, cPhone=-1, cDesc=-1, cLoc=-1;
  for(let r=0;r<Math.min(aoa.length,15);r++){
    const row=aoa[r].map(cleanHead);
    const fp=row.findIndex(h=>h.includes('جوال')||h.includes('الهاتف')||h.includes('موبايل'));
    const fd=row.findIndex(h=>h.includes('الوصف')||h==='وصف');
    const fl=row.findIndex(h=>h.includes('موقعالبلاغ')||h.includes('الموقع')||h.includes('موقع'));
    if(fp>=0||fl>=0){ hr=r; cPhone=fp; cDesc=fd; cLoc=fl; break; }
  }
  if(hr<0) throw new Error('لم أجد أعمدة «رقم الجوال» و«موقع البلاغ» في الملف');
  if(cLoc<0) throw new Error('لم أجد عمود «موقع البلاغ»');

  const map=new Map(), out=[];
  for(let r=hr+1;r<aoa.length;r++){
    const row=aoa[r];
    if(!row||row.every(c=>String(c).trim()==='')) continue;
    // قيمة الموقع: الرابط المخفي داخل الخلية إن وجد، وإلا النص
    const addr=XLSX.utils.encode_cell({r:range.s.r+r,c:range.s.c+cLoc});
    const cell=ws[addr];
    const link=cell&&cell.l&&cell.l.Target?cell.l.Target:'';
    const locText=String(row[cLoc]??'').trim();
    const rawLoc=link||locText;
    const coords=extractCoords(link)||extractCoords(locText);

    const phoneRaw=cPhone>=0?String(row[cPhone]??'').trim():'';
    const phone=normPhone(phoneRaw);
    const desc=cDesc>=0?String(row[cDesc]??'').trim():'';
    const key=phone?('p'+phone):('r'+r);

    if(phone && map.has(key)){
      const ex=map.get(key);
      ex.count++;
      if(ex.lat==null && coords){ ex.lat=coords.lat; ex.lng=coords.lng; ex.rawLoc=rawLoc; }
      if(!ex.desc && desc) ex.desc=desc;
      continue;
    }
    const rec={key,phone:phone||phoneRaw,desc,rawLoc,lat:coords?coords.lat:null,lng:coords?coords.lng:null,count:1};
    map.set(key,rec); out.push(rec);
  }
  return out;
}

$('btnExcel').addEventListener('click',()=>{
  if(!window.XLSX){toast('⚠️ مكتبة Excel لم تُحمّل — تحقق من الإنترنت');return;}
  $('excelInput').click();
});
$('excelInput').addEventListener('change',async e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file) return;
  try{
    if(reportRows.length && !confirm('سيتم استبدال الجدول الحالي بالملف الجديد. متابعة؟')) return;
    showOverlay('📊 جارٍ قراءة ملف Excel...');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const rows=parseWorkbook(wb);
    if(!rows.length) throw new Error('لا توجد صفوف في الملف');
    reportRows=rows; reportFile=file.name;
    await metaSet('reportRows',reportRows);
    await metaSet('reportFile',reportFile);
    hideOverlay();
    const noCoord=rows.filter(r=>r.lat==null).length;
    toast(`✅ تم إدراج ${rows.length} بلاغ`+(noCoord?` — ${noCoord} بدون إحداثيات`:''),5000);
    render();
  }catch(err){
    console.error(err);
    hideOverlay();
    toast('❌ '+(err.message||'تعذر قراءة الملف'),6000);
  }
});

$('btnClearTable').addEventListener('click',async()=>{
  if(!confirm('حذف الجدول؟ (الصور تبقى محفوظة)'))return;
  reportRows=[]; reportFile='';
  try{ await metaSet('reportRows',[]); await metaSet('reportFile',''); }catch(_){}
  render(); toast('🗑️ تم مسح الجدول');
});

  if(!file){ e.target.value=''; return; }
  try{
    showOverlay('📍 جارٍ تحديد الموقع...');

    const dataUrl=await compressImage(file);
    e.target.value='';
    showOverlay('💾 جارٍ الحفظ...');
    await addPhoto({dataUrl,lat:pos?pos.lat:null,lng:pos?pos.lng:null,acc:pos?Math.round(pos.acc):null,time:Date.now(),rowKey:rowKey||null});

    console.error(err);
    e.target.value='';
    hideOverlay();

});

function openLightbox(p){
  const coord=fmtCoord(p);
  $('lbImg').src=p.dataUrl;
  $('lbCoord').textContent=coord?('📍 '+coord):'⚠️ بدون إحداثيات';
  $('lbTime').textContent=fmtTime(p.time);
  $('lightbox').classList.add('show');
}

/* ================== Render table ================== */
function renderTable(photos){
  const box=$('tableBox');
  if(!reportRows.length){ box.classList.remove('show'); return; }
  box.classList.add('show');

  // آخر صورة لكل صف
  const last={};
  photos.forEach(p=>{ if(p.rowKey) last[p.rowKey]=p; });
  const done=reportRows.filter(r=>last[r.key]).length;
  $('tableTitle').innerHTML=`📊 ${esc(reportFile)} — البلاغات: <b>${reportRows.length}</b> | تم تصويرها: <b>${done}</b>`;

  const tb=$('tableBody'); tb.innerHTML='';
  reportRows.forEach(r=>{
    const p=last[r.key];
    const tr=document.createElement('tr');

    // موقع البلاغ
    let locHtml;
    if(r.lat!=null){
      locHtml=`<div class="coord-sm"><a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</a></div>`;
    }else{
      locHtml=`<div class="warn">⚠️ تعذر استخراج الإحداثيات${isShortLink(r.rawLoc)?'<br>(رابط مختصر)':''}</div>`;
    }

    // الصورة
    let photoHtml='';
    if(p){
      photoHtml=`<img class="row-img" src="${p.dataUrl}" alt="">
        ${p.lat!=null?`<div class="coord-sm">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>`:'<div class="warn">⚠️ بدون إحداثيات</div>'}
        <div class="time-sm">🕒 ${fmtTime(p.time)}</div>
        <button class="btn-row again">🔄 إعادة التقاط</button>`;
    }else{
      photoHtml=`<button class="btn-row">📸 التقاط صورة</button>`;
    }

    // الفرق
    let distHtml='—';
    if(p && p.lat!=null && r.lat!=null){
      const m=distM(r.lat,r.lng,p.lat,p.lng);
      distHtml=`<span class="dist ${distClass(m)}">${fmtDist(m)}</span>`;
    }

    tr.innerHTML=`
      <td class="ltr">${esc(r.phone)||'—'}</td>
      <td class="td-desc">${esc(r.desc)||'—'}</td>
      <td>${locHtml}</td>
      <td>${photoHtml}</td>
      <td>${distHtml}</td>
      <td><span class="count ${r.count>1?'dup':''}">${r.count}</span></td>`;

    tr.querySelector('.btn-row').addEventListener('click',()=>{
      captureRowKey=r.key;
      $('cameraInput').click();
    });
    const img=tr.querySelector('.row-img');
    if(img) img.addEventListener('click',()=>openLightbox(p));
    tb.appendChild(tr);
  });
}

/* ================== Render gallery ================== */
async function render(){
  let photos=[];
  try{ photos=await getAllPhotos(); }
  catch(err){ console.error(err); toast(explainError(err),6000); }
  renderTable(photos);
  $('stats').innerHTML=photos.length?`📷 عدد الصور المحفوظة: <b>${photos.length}</b>`:'';
  $('empty').style.display=photos.length?'none':'block';
  $('grid').innerHTML='';
  photos.forEach(p=>{
    const card=document.createElement('div'); card.className='card';
    const coord=fmtCoord(p);
    const row=p.rowKey?reportRows.find(r=>r.key===p.rowKey):null;
    card.innerHTML=`
      <img src="${p.dataUrl}" alt="">
      <div class="info">
        ${coord?`<div class="coord">📍 ${coord}</div>`:`<div class="no-gps">⚠️ بدون إحداثيات</div>`}
        <div class="time">🕒 ${fmtTime(p.time)}</div>
        ${row?`<div class="time">📞 <span class="ltr">${esc(row.phone)}</span></div>`:''}
      </div>
      <button class="del">🗑️ حذف</button>`;
    card.querySelector('img').addEventListener('click',()=>openLightbox(p));
    card.querySelector('.del').addEventListener('click',async()=>{
      if(!confirm('حذف هذه الصورة؟'))return;
      try{ await deletePhoto(p.id); render(); toast('🗑️ تم الحذف'); }
      catch(err){ toast(explainError(err),6000); }
    });
    $('grid').appendChild(card);
  });
}

/* ================== PDF Export ================== */
$('btnPdf').addEventListener('click',async()=>{
  let photos;
  try{ photos=await getAllPhotos(); }catch(err){ toast(explainError(err),6000); return; }
  // إذا كان هناك جدول: نأخذ صور صفوف الجدول فقط (آخر صورة لكل صف وبنفس ترتيب الجدول)
  if(reportRows.length){
    const last={};
    photos.forEach(p=>{ if(p.rowKey) last[p.rowKey]=p; });
    photos=reportRows.map(r=>last[r.key]).filter(Boolean);
    if(!photos.length){toast('لا توجد صور ملتقطة من صفوف الجدول');return;}
  }
  if(!photos.length){toast('لا توجد صور للتصدير');return;}
  if(!window.jspdf){toast('⚠️ مكتبة PDF لم تُحمّل (تحقق من الإنترنت أول مرة)');return;}

  const hood=getHood();
  showOverlay('🔤 جارٍ تحميل الخط العربي...');
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const arabicOK=await loadArabicFont(doc);
  const arFont=()=>doc.setFont(arabicOK?'ArabicFont':'helvetica','normal');
  const enFont=(s='normal')=>doc.setFont('helvetica',s);
  const arTxt=(ar,en)=>arabicOK?AR(ar):en;

  try{
    showOverlay('📄 جارٍ إنشاء ملف PDF...');

    const pageW=210,pageH=297,margin=10,gap=6,headerH=20,footH=9;
    const gridTop=margin+headerH;
    const cellW=(pageW-2*margin-gap)/2;
    const cellH=(pageH-gridTop-footH-gap)/2;
    const capH=26;
    const imgH=cellH-capH;

    photos.forEach((p,i)=>{
      if(i>0 && i%4===0) doc.addPage();
      const pos=i%4;
      const col=pos%2, row=Math.floor(pos/2);
      const x=margin+col*(cellW+gap);
      const y=gridTop+row*(cellH+gap);
      const cx=x+cellW/2;
      const mapUrl=p.lat!=null?`https://www.google.com/maps?q=${p.lat},${p.lng}`:null;

      doc.addImage(p.dataUrl,'JPEG',x,y,cellW,imgH);
      doc.setDrawColor(180); doc.setLineWidth(0.3);
      doc.rect(x,y,cellW,cellH);

      if(mapUrl){
        enFont('bold'); doc.setFontSize(9.5); doc.setTextColor(0);
        doc.text(`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`, cx, y+imgH+5, {align:'center'});
      }else{
        enFont('bold'); doc.setFontSize(9.5); doc.setTextColor(200,0,0);
        doc.text('GPS: Not available', cx, y+imgH+5, {align:'center'});
      }

      enFont(); doc.setFontSize(8.5); doc.setTextColor(90);
      doc.text(fmtTimeNum(p.time), cx, y+imgH+10.5, {align:'center'});

      if(mapUrl){
        const bw=55,bh=8,bx=cx-bw/2,by=y+imgH+14;
        doc.setFillColor(26,115,232);
        doc.roundedRect(bx,by,bw,bh,2,2,'F');
        arFont(); doc.setFontSize(10); doc.setTextColor(255);
        doc.text(arTxt('فتح الموقع في الخرائط','Open in Google Maps'), cx, by+5.5, {align:'center'});
        doc.link(bx,by,bw,bh,{url:mapUrl});
        doc.link(x,y,cellW,imgH,{url:mapUrl});
      }

      enFont(); doc.setFontSize(8); doc.setTextColor(150);
      doc.text(`#${i+1}`, x+2.5, y+4);
    });

    const total=Math.ceil(photos.length/4);
    for(let pg=1;pg<=total;pg++){
      doc.setPage(pg);
      arFont(); doc.setFontSize(15); doc.setTextColor(15,60,80);
      doc.text(arTxt('تقرير الصور','Photos Report'), pageW/2, margin+6, {align:'center'});

      arFont(); doc.setFontSize(11); doc.setTextColor(60);
      doc.text(arTxt('الحي: '+(hood||'—'),'Hood: '+(hood||'-')), pageW-margin, margin+13, {align:'right'});

      enFont(); doc.setFontSize(9); doc.setTextColor(60);
      doc.text(fmtTimeNum(Date.now()), margin, margin+13, {align:'left'});

      doc.setDrawColor(15,60,80); doc.setLineWidth(0.6);
      doc.line(margin, gridTop-4, pageW-margin, gridTop-4);

      enFont(); doc.setFontSize(9); doc.setTextColor(120);
      doc.text(`${pg} / ${total}`, pageW/2, pageH-5, {align:'center'});
    }

    const fname=(hood?hood.replace(/[\\/:*?"<>|]/g,'-')+'-':'')+'تقرير-الصور.pdf';
    doc.save(fname);
    toast(arabicOK?'✅ تم تصدير PDF بالعربية':'✅ تم التصدير (بدون خط عربي)');
  }catch(err){
    console.error(err);
    toast('❌ فشل إنشاء PDF');
  }finally{
    hideOverlay();
  }
});
